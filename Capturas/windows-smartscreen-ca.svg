<svg xmlns="http://www.w3.org/2000/svg" width="944" height="372" viewBox="0 0 944 372" font-family="Segoe UI, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" role="img" aria-label="El Windows ha protegit l'ordinador: Prem «Més informació», Prem «Executa igualment»">
<title>El Windows ha protegit l'ordinador</title>
<g transform="translate(0,46)">
<rect width="460" height="300" fill="#0a5fb4"/>
<text x="438" y="26" font-size="15" font-weight="400" fill="#fff" text-anchor="end">✕</text>
<text x="26" y="50" font-size="22" font-weight="600" fill="#fff" text-anchor="start">El Windows ha protegit l'ordinador</text>
<text x="26" y="84" font-size="13" font-weight="400" fill="#fff" text-anchor="start">El Microsoft Defender SmartScreen ha impedit que s'iniciï</text>
<text x="26" y="103" font-size="13" font-weight="400" fill="#fff" text-anchor="start">una aplicació no reconeguda. Executar aquesta aplicació pot</text>
<text x="26" y="122" font-size="13" font-weight="400" fill="#fff" text-anchor="start">posar l'ordinador en perill.</text>
<text x="26" y="151" font-size="13" fill="#fff" text-decoration="underline">Més informació</text>
<rect x="19" y="133" width="120.39999999999999" height="27" rx="6" fill="none" stroke="#ffb900" stroke-width="3.5"/>
<rect x="304" y="248" width="130" height="32" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1.5"/>
<text x="369.0" y="269" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">No l'executis</text>
</g>
<circle cx="14" cy="22" r="14" fill="#ffb900"/>
<text x="14" y="27" font-size="15" font-weight="700" fill="#1b1b1b" text-anchor="middle">1</text>
<text x="36" y="27" font-size="15" font-weight="600" fill="#555" text-anchor="start">Prem «Més informació»</text>
<g transform="translate(484,46)">
<rect width="460" height="300" fill="#0a5fb4"/>
<text x="438" y="26" font-size="15" font-weight="400" fill="#fff" text-anchor="end">✕</text>
<text x="26" y="50" font-size="22" font-weight="600" fill="#fff" text-anchor="start">El Windows ha protegit l'ordinador</text>
<text x="26" y="84" font-size="13" font-weight="400" fill="#fff" text-anchor="start">El Microsoft Defender SmartScreen ha impedit que s'iniciï</text>
<text x="26" y="103" font-size="13" font-weight="400" fill="#fff" text-anchor="start">una aplicació no reconeguda. Executar aquesta aplicació pot</text>
<text x="26" y="122" font-size="13" font-weight="400" fill="#fff" text-anchor="start">posar l'ordinador en perill.</text>
<text x="26" y="151" font-size="13" font-weight="400" fill="#fff" text-anchor="start">Aplicació: MantPro_Setup.exe</text>
<text x="26" y="171" font-size="13" font-weight="400" fill="#fff" text-anchor="start">Editor: Editor desconegut</text>
<rect x="143" y="248" width="149" height="32" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1.5"/>
<text x="217.5" y="269" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Executa igualment</text>
<rect x="138" y="243" width="159" height="42" rx="6" fill="none" stroke="#ffb900" stroke-width="3.5"/>
<rect x="304" y="248" width="130" height="32" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1.5"/>
<text x="369.0" y="269" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">No l'executis</text>
</g>
<circle cx="498" cy="22" r="14" fill="#ffb900"/>
<text x="498" y="27" font-size="15" font-weight="700" fill="#1b1b1b" text-anchor="middle">2</text>
<text x="520" y="27" font-size="15" font-weight="600" fill="#555" text-anchor="start">Prem «Executa igualment»</text>
<text x="944" y="366" font-size="11" font-weight="400" fill="#888" text-anchor="end">Imatge il·lustrativa</text>
