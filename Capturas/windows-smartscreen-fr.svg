<svg xmlns="http://www.w3.org/2000/svg" width="944" height="372" viewBox="0 0 944 372" font-family="Segoe UI, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" role="img" aria-label="Windows a protégé votre ordinateur: Cliquez sur « Informations complémentaires », Cliquez sur « Exécuter quand même »">
<title>Windows a protégé votre ordinateur</title>
<g transform="translate(0,46)">
<rect width="460" height="300" fill="#0a5fb4"/>
<text x="438" y="26" font-size="15" font-weight="400" fill="#fff" text-anchor="end">✕</text>
<text x="26" y="50" font-size="22" font-weight="600" fill="#fff" text-anchor="start">Windows a protégé votre ordinateur</text>
<text x="26" y="84" font-size="13" font-weight="400" fill="#fff" text-anchor="start">Microsoft Defender SmartScreen a empêché le démarrage d'une</text>
<text x="26" y="103" font-size="13" font-weight="400" fill="#fff" text-anchor="start">application non reconnue. L'exécution de cette application</text>
<text x="26" y="122" font-size="13" font-weight="400" fill="#fff" text-anchor="start">peut présenter un risque pour votre ordinateur.</text>
<text x="26" y="151" font-size="13" fill="#fff" text-decoration="underline">Informations complémentaires</text>
<rect x="19" y="133" width="226.79999999999998" height="27" rx="6" fill="none" stroke="#ffb900" stroke-width="3.5"/>
<rect x="304" y="248" width="130" height="32" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1.5"/>
<text x="369.0" y="269" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Ne pas exécuter</text>
</g>
<circle cx="14" cy="22" r="14" fill="#ffb900"/>
<text x="14" y="27" font-size="15" font-weight="700" fill="#1b1b1b" text-anchor="middle">1</text>
<text x="36" y="27" font-size="15" font-weight="600" fill="#555" text-anchor="start">Cliquez sur « Informations complémentaires »</text>
<g transform="translate(484,46)">
