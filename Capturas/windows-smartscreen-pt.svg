<svg xmlns="http://www.w3.org/2000/svg" width="944" height="372" viewBox="0 0 944 372" font-family="Segoe UI, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" role="img" aria-label="O Windows protegeu o computador: Clique em “Mais informações”, Clique em “Executar assim mesmo”">
<title>O Windows protegeu o computador</title>
<g transform="translate(0,46)">
<rect width="460" height="300" fill="#0a5fb4"/>
<text x="438" y="26" font-size="15" font-weight="400" fill="#fff" text-anchor="end">✕</text>
<text x="26" y="50" font-size="22" font-weight="600" fill="#fff" text-anchor="start">O Windows protegeu o computador</text>
<text x="26" y="84" font-size="13" font-weight="400" fill="#fff" text-anchor="start">O Microsoft Defender SmartScreen impediu a inicialização de</text>
<text x="26" y="103" font-size="13" font-weight="400" fill="#fff" text-anchor="start">um aplicativo não reconhecido. A execução deste aplicativo</text>
<text x="26" y="122" font-size="13" font-weight="400" fill="#fff" text-anchor="start">pode colocar seu PC em risco.</text>
<text x="26" y="151" font-size="13" fill="#fff" text-decoration="underline">Mais informações</text>
<rect x="19" y="133" width="135.6" height="27" rx="6" fill="none" stroke="#ffb900" stroke-width="3.5"/>
<rect x="304" y="248" width="130" height="32" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1.5"/>
<text x="369.0" y="269" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Não executar</text>
</g>
<circle cx="14" cy="22" r="14" fill="#ffb900"/>
<text x="14" y="27" font-size="15" font-weight="700" fill="#1b1b1b" text-anchor="middle">1</text>
<text x="36" y="27" font-size="15" font-weight="600" fill="#555" text-anchor="start">Clique em “Mais informações”</text>
<g transform="translate(484,46)">
<rect width="460" height="300" fill="#0a5fb4"/>
<text x="438" y="26" font-size="15" font-weight="400" fill="#fff" text-anchor="end">✕</text>
<text x="26" y="50" font-size="22" font-weight="600" fill="#fff" text-anchor="start">O Windows protegeu o computador</text>
<text x="26" y="84" font-size="13" font-weight="400" fill="#fff" text-anchor="start">O Microsoft Defender SmartScreen impediu a inicialização de</text>
<text x="26" y="103" font-size="13" font-weight="400" fill="#fff" text-anchor="start">um aplicativo não reconhecido. A execução deste aplicativo</text>
<text x="26" y="122" font-size="13" font-weight="400" fill="#fff" text-anchor="start">pode colocar seu PC em risco.</text>
<text x="26" y="151" font-size="13" font-weight="400" fill="#fff" text-anchor="start">Aplicativo: MantPro_Setup.exe</text>
<text x="26" y="171" font-size="13" font-weight="400" fill="#fff" text-anchor="start">Editor: Editor desconhecido</text>
<rect x="120" y="248" width="172" height="32" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1.5"/>
<text x="206.0" y="269" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Executar assim mesmo</text>
<rect x="115" y="243" width="182" height="42" rx="6" fill="none" stroke="#ffb900" stroke-width="3.5"/>
<rect x="304" y="248" width="130" height="32" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1.5"/>
<text x="369.0" y="269" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">Não executar</text>
</g>
<circle cx="498" cy="22" r="14" fill="#ffb900"/>
<text x="498" y="27" font-size="15" font-weight="700" fill="#1b1b1b" text-anchor="middle">2</text>
<text x="520" y="27" font-size="15" font-weight="600" fill="#555" text-anchor="start">Clique em “Executar assim mesmo”</text>
<text x="944" y="366" font-size="11" font-weight="400" fill="#888" text-anchor="end">Imagem ilustrativa</text>
</svg>
