name: Compilar Móvil (Android APK)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mantenimiento_app

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Instalar Dependencias Flutter
      run: flutter pub get

    - name: Preparar firma de la APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/release.jks
        cat > android/key.properties << EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEYSTORE_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=$(pwd)/android/app/release.jks
        EOF

    - name: Construir APK (Release)
      run: flutter build apk --release --no-tree-shake-icons

    - name: Renombrar APK a MantPro.apk
      run: |
        cd build/app/outputs/flutter-apk/
        mv app-release.apk MantPro.apk

    - name: Subir Artefacto (Siempre)
      uses: actions/upload-artifact@v4
      with:
        name: MantPro-Android-APK
        path: mantenimiento_app/build/app/outputs/flutter-apk/MantPro.apk

    - name: Publicar en Release (Solo si hay Tag)
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: mantenimiento_app/build/app/outputs/flutter-apk/MantPro.apk
        fail_on_unmatched_files: true
