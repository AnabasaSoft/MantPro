name: Compilar Móvil (Android APKs)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mantenimiento_app

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Instalar Dependencias Flutter
      run: flutter pub get

    # La versión de la app sale siempre del tag de GitHub (v3.9.9 -> 3.9.9),
    # nunca del valor que haya quedado escrito a mano en el código: así no
    # hace falta correr bump_version.py antes de taguear un release.
    - name: Preparar versión desde el tag
      run: |
        TAG_NAME=${GITHUB_REF_NAME}
        CLEAN_VERSION=${TAG_NAME#v}
        if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" == "main" ]; then
          CLEAN_VERSION="0.0.0"
        fi
        # El versionCode sale solo de la parte numérica: en una versión de
        # pruebas (3.10.2-dev.1, 3.10.2-rc.1) se ignora el sufijo y queda igual
        # que la final (31002), que así se instala encima sin problema.
        NUMEROS="${CLEAN_VERSION%%-*}"
        if ! [[ "$NUMEROS" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
          echo "::error::Versión no válida: '$CLEAN_VERSION'"; exit 1
        fi
        IFS='.' read -r MAJOR MINOR PATCH <<< "$NUMEROS"
        # versionCode de Android: tiene que crecer SIEMPRE de una versión a la
        # siguiente o el móvil rechaza la actualización ("paquete no válido").
        # MAYOR*10000 + MENOR*100 + PARCHE: 3.9.21 -> 30921, 3.10.0 -> 31000.
        # (La fórmula anterior, MAYOR*100 + MENOR*10 + PARCHE, daba 411 para
        # 3.9.21 y 400 para 3.10.0.) "10#" fuerza base 10 ("08" no es octal).
        MAJOR=$((10#${MAJOR:-0})); MINOR=$((10#${MINOR:-0})); PATCH=$((10#${PATCH:-0}))
        if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
          echo "::error::La versión menor y el parche deben ser menores de 100 ($CLEAN_VERSION)"; exit 1
        fi
        BUILD_NUMBER=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
        sed -i "s/^version: .*/version: $CLEAN_VERSION+$BUILD_NUMBER/" pubspec.yaml
        sed -i "s/const String kAppVersion = '.*';/const String kAppVersion = '$CLEAN_VERSION';/" lib/main.dart

    - name: Preparar firma de la APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/release.jks
        cat > android/key.properties << EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEYSTORE_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=$(pwd)/android/app/release.jks
        EOF

    - name: Construir APK (Release)
      run: flutter build apk --release --no-tree-shake-icons

    - name: Renombrar APK a MantPro.apk
      run: |
        cd build/app/outputs/flutter-apk/
        mv app-release.apk MantPro.apk

    - name: Subir Artefacto (Siempre)
      uses: actions/upload-artifact@v4
      with:
        name: MantPro-Android-APK
        path: mantenimiento_app/build/app/outputs/flutter-apk/MantPro.apk

    - name: Publicar en Release (Solo si hay Tag)
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: mantenimiento_app/build/app/outputs/flutter-apk/MantPro.apk
        fail_on_unmatched_files: true

  build-android-stock:
