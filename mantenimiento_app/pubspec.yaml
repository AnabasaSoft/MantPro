name: app_mantenimiento
description: App offline para mantenimiento
publish_to: 'none'
version: 3.8.0+380

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4    # Para la cámara
  http: ^1.1.0            # Para enviar datos al PC
  mobile_scanner: ^3.5.5  # Para leer el QR del PC
  device_info_plus: ^11.5.0  # Para identificar el móvil en "Sesiones de dispositivos"
  permission_handler: ^11.0.1
  path_provider: ^2.1.1   # Para guardar archivos temporalmente
  flutter_launcher_icons: ^0.13.1
  shared_preferences: ^2.2.2
  image_painter: ^0.7.0
  path: ^1.8.3
  url_launcher: ^6.3.2
  timezone: ^0.11.1
  flutter_local_notifications: ^22.1.0
  flutter_timezone: ^3.0.0

flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icono.png"
  min_sdk_android: 21
